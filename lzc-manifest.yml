application:
  subdomain: beaverhabits
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://beaverhabits:8080/
services:
  beaverhabits:
    # upstream: daya0576/beaverhabits:0.10.0
    image: docker.1ms.run/daya0576/beaverhabits:0.10.0
    environment:
      - HABITS_STORAGE=USER_DISK
      - TRUSTED_LOCAL_EMAIL=admin@${LAZYCAT_BOX_DOMAIN}
      - INDEX_HABIT_DATE_COLUMNS=5
      - ENABLE_IOS_STANDALONE=true
    binds:
      - /lzcapp/var/data:/app/.user/
    setup_script: |
      if [ ! -d /app/.user ]; then
       mkdir -p /app/.user
      fi
